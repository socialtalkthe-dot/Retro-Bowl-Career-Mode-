<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Classic Retro Bowl</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #gm4html5_div_id {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      canvas {
        max-width: 100%;
        max-height: 100%;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="gm4html5_div_id">
      <canvas id="canvas" width="960" height="540">
        <p>Your browser does not support HTML5 Canvas.</p>
      </canvas>
    </div>
    <script>
      window.g_GameMakerHTML5Dir = "./";
    </script>
    <script src="./tph_crazygames.js"></script>
    <script src="./vph_poki.js"></script>
    <script src="./RetroBowl.js"></script>
    <script>
      window.addEventListener("load", function () {
        if (typeof GameMaker_Init === "function") {
          GameMaker_Init();
        }
      });
    </script>
  </body>
</html>
